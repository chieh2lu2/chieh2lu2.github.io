<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#EE6889"/>
      <stop offset="48%"  stop-color="#b76fd4"/>
      <stop offset="100%" stop-color="#4f63d6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.18" r="0.66">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.82" cy="0.84" r="0.72">
      <stop offset="0%"   stop-color="#ffe3ec" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#ffe3ec" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#ffffff" fill-opacity="0.13"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#dots)"/>

  <!-- 大块柔和光斑，中间留白给文章标题 -->
  <ellipse cx="300" cy="180" rx="330" ry="230" fill="#ffffff" fill-opacity="0.22" filter="url(#soft)"/>
  <ellipse cx="1320" cy="560" rx="360" ry="250" fill="#3d51c4" fill-opacity="0.40" filter="url(#soft)"/>

  <rect width="1600" height="700" fill="url(#glowA)"/>
  <rect width="1600" height="700" fill="url(#glowB)"/>

  <!-- 右侧同心弧 -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.8">
    <circle cx="1460" cy="90" r="150"/>
    <circle cx="1460" cy="90" r="230"/>
    <circle cx="1460" cy="90" r="310"/>
  </g>

  <!-- 左下波浪 -->
  <path d="M0 620 C 260 560, 420 690, 700 640 C 980 590, 1120 700, 1600 630 L1600 700 L0 700 Z"
        fill="#ffffff" fill-opacity="0.09"/>

  <!-- 上下渐隐，保证标题文字在任何位置都读得清 -->
  <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#000000" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <rect width="1600" height="260" fill="url(#fadeTop)"/>
  <linearGradient id="fadeBot" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.26"/>
  </linearGradient>
  <rect y="440" width="1600" height="260" fill="url(#fadeBot)"/>
</svg>
