<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================================
   图片懒加载占位图（兜底图）
  ============================================================================
   Fluid 的懒加载机制会给每张 <img> 加上 srcset="这张图" + class="lazyload"，
   等真正的图进入视口、JS 把 srcset 去掉之前，浏览器显示的就是这张。

   所以它的设计要求是：
     · 要"像还没加载完"，而不是"像一张图"—— 之前用的是站点 logo（红色艺术字），
       结果头像位置会先显示一个大红字，非常突兀（用户截图报过）
     · 中性灰，亮色/暗色主题下都不刺眼
     · 极简：一条浅灰底 + 一个居中的图片图标，一眼就知道是占位
     · 体积小（这里是 1 KB 级别，纯矢量）

   想换风格直接改这个文件就行，改完重新发布即可。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="loading">
  <defs>
    <linearGradient id="zeraSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.055"/>
      <stop offset="45%"  stop-color="#000000" stop-opacity="0.035"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.055"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="2.4s" repeatCount="indefinite"/>
    </linearGradient>

    <symbol id="zeraImgIcon" viewBox="0 0 24 24">
      <path d="M4.5 3h15A2.5 2.5 0 0 1 22 5.5v13A2.5 2.5 0 0 1 19.5 21h-15A2.5 2.5 0 0 1 2 18.5v-13A2.5 2.5 0 0 1 4.5 3Zm0 1.6a.9.9 0 0 0-.9.9v8.9l3.6-3.4a1.5 1.5 0 0 1 2.05.02l2.4 2.3 3.1-3.1a1.5 1.5 0 0 1 2.08-.02l3.37 3.2V5.5a.9.9 0 0 0-.9-.9H4.5Zm14.6 11.05-4.06-3.86a.35.35 0 0 0-.48.01l-3.13 3.13-2.46-2.36a.35.35 0 0 0-.48 0L3.6 16.4v2.1c0 .5.4.9.9.9h15a.9.9 0 0 0 .9-.9v-2.85ZM8.4 6.3a2.1 2.1 0 1 1 0 4.2 2.1 2.1 0 0 1 0-4.2Z"/>
    </symbol>
  </defs>

  <!-- 底：极浅的中性灰，深浅主题下都只是"一块安静的底色" -->
  <rect width="160" height="160" fill="#888888" fill-opacity="0.055"/>

  <!-- 斜向流光，让"正在加载"的感觉更明显一点 -->
  <rect width="160" height="160" fill="url(#zeraSheen)"/>

  <!-- 居中的图片图标 -->
  <use href="#zeraImgIcon" x="56" y="56" width="48" height="48"
       fill="#888888" fill-opacity="0.28"/>
</svg>
